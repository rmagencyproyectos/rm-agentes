/* Sistema: rótulo → titular con palabra marcada → apoyo → maqueta que ilustra la frase → «desliza». */
:root{--red:#ff2041;--red-deep:#c2002c;--pink:#ffd3da;--ink:#15121a;--ink-2:#2a2530;--mute:#5c5563;--mute-2:#948e9c;--line:#e6e2ea;--bg:#f4f2f6;--card:#fff;--green:#1fb86a}
*{box-sizing:border-box}
body{margin:0;font-family:"Glacial","Avenir Next",sans-serif;background:#000;color:var(--ink)}
.pano{display:flex}
.sl{position:relative;flex:none;width:1080px;height:1350px;background:var(--bg);padding:92px 96px 0;display:flex;flex-direction:column;overflow:hidden}
.ey{display:flex;align-items:center;gap:18px;font-size:26px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--red)}
.ey::before{content:"";width:44px;height:3px;background:var(--red)}
h2{font-size:86px;line-height:1.02;letter-spacing:-.02em;margin:26px 0 0;text-wrap:balance}
.hl{background:linear-gradient(180deg,transparent 14%,var(--pink) 14%,var(--pink) 90%,transparent 90%);padding:0 .1em;margin:0 -.04em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{font-size:36px;line-height:1.3;color:var(--ink);margin:22px 0 0;max-width:24em;text-wrap:pretty}
.vis{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:40px 0 150px;min-height:0}
.foot{position:absolute;left:96px;right:96px;bottom:48px;display:flex;justify-content:space-between;align-items:center;font-size:28px}
.ey.q{font-size:40px;letter-spacing:0;text-transform:none}
.bridge{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:40px;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:60px;padding:14px 16px 14px 34px;box-shadow:0 14px 30px rgba(21,18,26,.08)}
.bridge i{width:64px;height:64px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.bridge i svg{width:32px;height:32px}
.foot .sw{margin-left:auto;color:var(--red);font-weight:700;font-style:italic}
.compat{display:flex;align-items:center;gap:20px;margin-top:28px;width:600px;font-size:26px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.compat .cbar{flex:1;height:16px;border-radius:16px;background:#e6e2ea;overflow:hidden}
.compat .cbar i{display:block;height:100%;background:var(--red);border-radius:16px}
.compat b{font-size:38px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
.gift{font-size:28px;color:var(--mute);display:flex;align-items:center;gap:12px}
.gift b{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:16px;margin-top:26px;align-self:flex-start;background:var(--card);border:2px solid var(--line);border-radius:40px;padding:10px 22px 10px 18px;font-size:26px;font-weight:700;color:var(--mute)}
.pill i{width:22px;height:22px;border-radius:50%;border:3px solid var(--line)}
.pill i.on{background:var(--red);border-color:var(--red)}

.card{background:var(--card);border:2px solid var(--line);border-radius:30px;box-shadow:0 30px 70px rgba(21,18,26,.10);overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:18px 24px;border-bottom:2px solid var(--line);font-size:22px;color:var(--mute-2)}
.bar b{width:14px;height:14px;border-radius:50%;background:var(--line)}
.bar span{margin-left:12px}
.arrow{position:absolute;pointer-events:none}
.arrow path{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.note{position:absolute;font-size:30px;font-weight:700;color:var(--red);font-style:italic;white-space:nowrap}

/* mapa */
.map{position:relative;width:640px;height:520px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.chip{position:absolute;translate:-50% -50%;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:8px 20px;font-size:26px;white-space:nowrap}
.chip.c{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;font-size:32px;padding:12px 28px}
/* tienda */
.shop{width:620px}
.awn{height:110px;background:repeating-linear-gradient(90deg,var(--red) 0 62px,#fff 62px 124px);border-radius:24px 24px 0 0;border:2px solid var(--line);border-bottom:0;position:relative}
.awn::after{content:"";position:absolute;left:0;right:0;bottom:-30px;height:30px;background:radial-gradient(circle at 31px 0,var(--red) 30px,transparent 31px) 0 0/124px 30px,radial-gradient(circle at 93px 0,#fff 30px,transparent 31px) 0 0/124px 30px}
.front{background:var(--card);border:2px solid var(--line);border-top:0;height:380px;padding:70px 46px 0;display:flex;gap:40px}
.win{flex:1;border:2px solid var(--line);border-radius:16px;background:linear-gradient(160deg,#fbfafc,#efecf2);position:relative}
.door{width:190px;border:2px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;position:relative;background:#faf9fb}
.door .sign{position:absolute;top:60px;left:50%;translate:-50% 0;background:var(--ink);color:#fff;font-weight:700;font-size:26px;padding:8px 18px;border-radius:8px;letter-spacing:.1em}
/* móvil bloqueo */
.phone{width:470px;height:640px;border-radius:64px;background:linear-gradient(170deg,#2a2530,#15121a 70%);border:10px solid #0c0a0f;padding:70px 26px 0;color:#fff;box-shadow:0 30px 70px rgba(21,18,26,.25);position:relative}
.phone .time{text-align:center;font-size:120px;font-weight:700;letter-spacing:-.03em;line-height:1}
.phone .date{text-align:center;font-size:24px;color:#d8d4de;margin:8px 0 40px}
.notif{background:rgba(255,255,255,.14);border-radius:24px;padding:16px 18px;display:flex;gap:16px;align-items:center;margin-bottom:12px}
.notif .ic{flex:none;width:52px;height:52px;border-radius:14px;background:linear-gradient(45deg,#ffd400,#ff2041 50%,#7c3aed)}
.notif b{display:block;font-size:22px}
.notif span{font-size:21px;color:#ece9f0}
/* calendario */
.cal{width:860px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;padding:26px}
.day{border:2px solid var(--line);border-radius:18px;padding:16px 10px;height:230px;display:flex;flex-direction:column;align-items:center;gap:14px}
.day b{font-size:30px}
.post{background:#fff5c2;border-radius:8px;padding:10px 8px;font-size:20px;line-height:1.15;text-align:center;rotate:-3deg;position:relative}
.post::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:4px;background:var(--red);rotate:-8deg}
/* post IG */
.igpost{width:520px}
.igh{display:flex;align-items:center;gap:14px;padding:18px 22px;font-size:24px;font-weight:700}
.igh i{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#948e9c,#d8d4de)}
.igimg{height:420px;background:linear-gradient(150deg,#e9e5ee,#d8d4de);display:grid;place-items:center;font-size:30px;color:var(--mute-2)}
.igf{padding:16px 22px;font-size:24px}
.bubble{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:40px;padding:22px 30px;font-size:34px;font-weight:700;white-space:nowrap}
/* notas */
.notes{width:720px;padding-bottom:30px}
