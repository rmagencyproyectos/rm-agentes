<title>Qué vídeos hacer</title>
<style>
/* Layout: panel de trabajo con la marca RM (Design System, 03/10/2026). Cabecera con logo y
   pestañas → titular en minúscula + cifras desplegables + qué es la nota → podio → mapa de
   calor → alcance vs conexión → tarjetas "haz más" / filas "evita" → evolución → comparador.
   La nota se escribe como multiplicador (×2,9 = 2,9 veces un vídeo normal de ese cliente). */
@font-face { font-family: "Glacial Indifference"; font-weight: 400; font-display: swap;
  src: url("GlacialIndifference-Regular.otf") format("opentype"); }
@font-face { font-family: "Glacial Indifference"; font-weight: 700; font-display: swap;
  src: url("GlacialIndifference-Bold.otf") format("opentype"); }
:root {
  --page: #f7f7f7; --card: #ffffff; --sunk: #efefef; --line: #e3e3e3;
  --ink: #15121a; --ink-2: #5c5563; --ink-3: #948e9c;
  --brand: #ff2041; --brand-hover: #e60034; --brand-tint: #ffe0e3; --on-brand: #ffffff;
  --good: #0b9a7d; --bad: #e60034; --neutral-bar: #d8d4de;
  --c1: #ff2041; --c2: #7c3aed; --c3: #0b9a7d; --c4: #b07d00;
  --f: "Glacial Indifference", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-s: 8px; --r-m: 14px; --r-l: 22px;
  --shadow-m: 0 4px 12px rgba(21,18,26,.08), 0 2px 4px rgba(21,18,26,.04);
  --shadow-brand: 0 8px 24px rgba(255,32,65,.28);
  --ease-bounce: cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #121016; --card: #1c1822; --sunk: #24202b; --line: #322c3a;
  --ink: #f3f0f6; --ink-2: #b7b0bf; --ink-3: #8a8492;
  --brand: #ff3352; --brand-hover: #ff5a73; --brand-tint: #3a1820; --on-brand: #ffffff;
  --good: #1fd8a8; --bad: #ff5a73; --neutral-bar: #4a4352;
  --c1: #ff2a4b; --c2: #8f63f3; --c3: #12a886; --c4: #b88500;
  --shadow-m: 0 4px 12px rgba(0,0,0,.35); --shadow-brand: 0 8px 24px rgba(255,51,82,.32); color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #121016; --card: #1c1822; --sunk: #24202b; --line: #322c3a;
  --ink: #f3f0f6; --ink-2: #b7b0bf; --ink-3: #8a8492;
  --brand: #ff3352; --brand-hover: #ff5a73; --brand-tint: #3a1820; --on-brand: #ffffff;
  --good: #1fd8a8; --bad: #ff5a73; --neutral-bar: #4a4352;
  --c1: #ff2a4b; --c2: #8f63f3; --c3: #12a886; --c4: #b88500;
  --shadow-m: 0 4px 12px rgba(0,0,0,.35); --shadow-brand: 0 8px 24px rgba(255,51,82,.32); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font: 400 16px/1.45 var(--f); }
a { color: var(--brand); text-decoration-thickness: 1px; text-underline-offset: 2px; }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.n { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; flex: none; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px 18px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { height: 30px; width: auto; }
.brand b { font-size: 18px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--ink-3); font-size: 12px; }
nav.tabs { display: flex; gap: 6px; margin-left: auto; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--ink-2); transition: transform .12s var(--ease-bounce); }
.tab:hover { border-color: var(--brand); color: var(--ink); }
.tab:active { transform: scale(.97); }
.tab[aria-selected="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); box-shadow: var(--shadow-brand); }
.tab i { font-style: normal; font-size: 11px; opacity: .75; margin-left: 4px; }

main { padding-block: 28px 72px; display: grid; gap: 40px; }
h2 { margin: 0; font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
.sub { margin: 6px 0 16px; color: var(--ink-2); max-width: 68ch; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 700; color: var(--ink-3); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px; box-shadow: var(--shadow-m); min-width: 0; }

/* Titular + cifras desplegables + qué es la nota */
.hero { display: grid; gap: 22px; }
.hero h1 { margin: 6px 0 0; font-weight: 700; font-size: clamp(34px, 6vw, 64px); line-height: 1.02; letter-spacing: -.02em; max-width: 16ch; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--brand); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: start; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px 16px; }
.tile b.n { display: block; font-size: 38px; line-height: 1; color: var(--brand); letter-spacing: -.02em; }
.tile span.lbl { font-size: 13px; color: var(--ink-2); }
.tile.dd summary { list-style: none; cursor: pointer; }
.tile.dd summary::-webkit-details-marker { display: none; }
.tile.dd:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
.tile.dd[open] { box-shadow: var(--shadow-brand); border-color: var(--brand); }
.tile.dd ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; }
.tile.dd li { display: block; }

.tile.dd li .n { color: var(--good); font-weight: 700; }
.nota-explica { background: var(--brand-tint); border-radius: var(--r-m); padding: 10px 16px; max-width: 86ch; }
.nota-explica summary { cursor: pointer; font-size: 15px; }
.nota-explica p { margin: 8px 0 2px; color: var(--ink-2); }
.note { border-radius: var(--r-m); background: var(--sunk); padding: 12px 16px; color: var(--ink-2); font-size: 15px; max-width: 86ch; }
.note b { color: var(--ink); }

/* Leyenda de clientes */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.legend button { border: 0; background: none; cursor: pointer; padding: 2px 0; color: var(--ink-2); display: inline-flex; align-items: center; }
.legend button[aria-pressed="false"] { opacity: .35; }

/* Podio legible */
ol.podio { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }
.prow { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.prow .pos { font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--ink-3); text-align: right; }
.prow:nth-child(-n+3) .pos { color: var(--brand); }
.pmain { display: grid; gap: 7px; min-width: 0; }
.ptitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ptitle b { font-size: 20px; letter-spacing: -.01em; }
.pdesc { margin: 0; font-size: 14px; color: var(--ink-2); }
.pbar { position: relative; height: 30px; background: var(--sunk); border-radius: 8px; }
.pbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); border-radius: 8px;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; min-width: 70px; }
.pbar .fill b { color: #fff; font-size: 17px; }
.pbar .one { position: absolute; top: -4px; bottom: -4px; border-left: 2px dashed var(--ink-3); }

/* Mapa de calor */
.heatwrap { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 520px; font-size: 14px; }
.heat thead th { font-weight: 700; font-size: 13px; color: var(--ink-2); text-align: center; padding: 4px; }
.heat th.grp { text-align: left; padding: 16px 4px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); }
.heat th.grp small { color: var(--ink-3); text-transform: none; letter-spacing: 0; font-weight: 400; }
.heat th.rowh { text-align: left; font-weight: 400; color: var(--ink); white-space: nowrap; cursor: help; padding-right: 8px; }
.heat td { text-align: center; border-radius: 8px; padding: 9px 4px; min-width: 76px; font-weight: 700; }
.heat td small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
.heat td.vacio { background: repeating-linear-gradient(135deg, var(--sunk) 0 5px, transparent 5px 10px); color: var(--ink-3); font-weight: 400; font-size: 12px; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); margin-top: 10px; flex-wrap: wrap; }
.scale .grad { width: 180px; height: 10px; border-radius: 5px; border: 1px solid var(--line);
  background: linear-gradient(90deg, var(--bad), color-mix(in srgb, var(--bad) 15%, var(--card)), var(--card), color-mix(in srgb, var(--good) 15%, var(--card)), var(--good)); }

/* SVG: dispersión, evolución, comparador */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg text { fill: var(--ink-3); font-family: var(--f); font-size: 11px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .base { stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 4 4; }
svg .quad { fill: var(--ink-3); font-size: 12px; font-weight: 700; opacity: .75; }
svg circle.pt { stroke: var(--card); stroke-width: 1.5; fill-opacity: .85; cursor: pointer; }
svg circle.pt:hover { stroke: var(--ink); }
svg circle.pt.a { fill: var(--brand); fill-opacity: .55; }
svg circle.pt.b { fill: var(--c2); fill-opacity: .55; }
svg path.ln { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
svg circle.ld { stroke: var(--card); stroke-width: 2; }
svg .medl { stroke-width: 3; } svg .medl.a { stroke: var(--brand); } svg .medl.b { stroke: var(--c2); }
svg .medt { font-weight: 700; font-size: 12px; } svg .medt.a { fill: var(--brand); } svg .medt.b { fill: var(--c2); }

/* Tarjetas haz más */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: border-color .2s; }
.card:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
.card .head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.card h3 { margin: 2px 0 0; font-size: 21px; line-height: 1.15; letter-spacing: -.01em; overflow-wrap: anywhere; }
.big { text-align: right; flex: none; }
.big b { font-size: 34px; line-height: 1; color: var(--good); letter-spacing: -.02em; }
.big span { display: block; font-size: 12px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; border-radius: 999px; padding: 3px 10px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.chip .sw { width: 8px; height: 8px; margin-right: 2px; }
.chip.good { background: color-mix(in srgb, var(--good) 16%, var(--card)); color: var(--ink); }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, var(--card)); color: var(--ink); }
.warn { font-size: 13px; color: var(--ink-2); }
.warn::before { content: "⚠ "; color: var(--brand); }
.why { margin: 0; font-size: 15px; color: var(--ink-2); border-left: 3px solid var(--brand-tint); padding-left: 10px; }
.ejemplos { display: grid; gap: 4px; font-size: 14px; }
.ejemplos a, .ejemplos span.t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adapt { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 10px; border-top: 1px dashed var(--line); }
.adapt .lbl { font-size: 13px; color: var(--ink-3); margin-right: 2px; }
.btn { border: 1.5px solid var(--brand); color: var(--brand); background: transparent; border-radius: var(--r-s);
  padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .12s var(--ease-bounce), box-shadow .2s; }
.btn:hover { box-shadow: var(--shadow-brand); }
.btn:active { transform: scale(.97); }
.btn.solid { background: var(--brand); color: var(--on-brand); }
.btn.solid:hover { background: var(--brand-hover); }
.btn.ghost { border-color: var(--line); color: var(--ink-2); }
.btn[disabled] { opacity: .4; cursor: not-allowed; box-shadow: none; }
.draft { background: var(--sunk); border-radius: var(--r-m); padding: 14px; display: grid; gap: 9px; }
.draft label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; display: grid; gap: 4px; }
.draft input, .draft textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--card);
  padding: 7px 9px; font-size: 15px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); }
.draft input:focus, .draft textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-tint); }
.draft textarea { resize: vertical; min-height: 66px; }
.draft .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.status { font-size: 14px; color: var(--ink-2); margin: 0; }
.status.ok { color: var(--good); } .status.err { color: var(--bad); }

/* Evita */
.rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 13px 18px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .t { font-weight: 700; overflow-wrap: anywhere; }
.row .v { font-weight: 700; font-size: 20px; color: var(--bad); text-align: right; }
.row .meta { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 12px; min-width: 0; }

/* Barras por etiqueta (pestaña cliente) */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.bars { display: grid; gap: 7px; align-content: start; }
.bars h3 { margin: 0 0 6px; font-size: 16px; }
.bars h3 small { color: var(--ink-3); font-weight: 400; }
.hb { display: grid; grid-template-columns: minmax(90px, 36%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; border-radius: 6px; }
.hb:hover, .hb:focus { background: var(--sunk); outline: none; }
.hb .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .track { position: relative; height: 16px; }
.hb .fill { position: absolute; left: 0; top: 3px; height: 10px; border-radius: 0 5px 5px 0; }
.hb .one { position: absolute; top: -2px; bottom: -2px; border-left: 1.5px dashed var(--ink-3); }
.fill.g { background: var(--good); } .fill.b { background: var(--bad); } .fill.nn { background: var(--neutral-bar); }
.fill.x { background: repeating-linear-gradient(135deg, var(--neutral-bar) 0 3px, transparent 3px 6px); }
.hb .v { color: var(--ink-2); font-size: 13px; white-space: nowrap; min-width: 62px; text-align: right; }
.key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }
.key i { display: inline-block; width: 12px; height: 9px; border-radius: 3px; margin-right: 5px; }

/* Comparador superpuesto */
.comp { display: grid; gap: 12px; }
.cselects { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.cselects label { display: flex; align-items: center; min-width: 0; }
.cselects select { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--card); padding: 8px 10px; font-size: 15px; }
.cselects .vs { font-weight: 700; color: var(--ink-3); }
.sw.a { background: var(--brand); } .sw.b { background: var(--c2); }
.cnums { display: flex; gap: 28px; flex-wrap: wrap; color: var(--ink-3); font-size: 14px; }
.cnums b { font-size: 32px; letter-spacing: -.02em; margin-right: 4px; }
.cnums .ca { color: var(--brand); } .cnums .cb { color: var(--c2); }
.cver { margin: 0; font-size: 18px; }

/* Circulares */
.dsel { display: inline-flex; flex-wrap: wrap; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); margin-bottom: 14px; }
.dsel button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; color: var(--ink-2); }
.dsel button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.donuts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; align-items: center; }
.donuts figure { margin: 0; text-align: center; }
.donuts figcaption { font-weight: 700; font-size: 15px; margin-top: 4px; }
svg.donut { max-width: 230px; margin: 0 auto; }
svg.donut path { cursor: default; }
svg text.dc { fill: var(--ink); font-size: 17px; font-weight: 700; }
.dleg { min-width: 0; grid-column: 1 / -1; }
.dleg th.r { text-align: right; }
.card.prop h3 { margin: 0; }
.dleg small.otros { color: var(--ink-3); }
p.dleg { grid-column: 1 / -1; margin: 0; }

/* Tablas */
.tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px; }
.t th, .t td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; }
.t th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; border-top: 0; }
.t td.num { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
.empty { background: var(--card); border: 1.5px dashed var(--line); border-radius: var(--r-l); padding: 26px; color: var(--ink-2); max-width: 70ch; }
.empty h3 { margin: 0 0 6px; font-size: 22px; color: var(--ink); }

#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--page);
  font-size: 13px; padding: 8px 11px; border-radius: 8px; max-width: 320px; line-height: 1.35; box-shadow: var(--shadow-m); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 560px) {
  .hb { grid-template-columns: minmax(80px, 32%) minmax(0, 1fr) auto; }
  .cselects { grid-template-columns: 1fr; } .cselects .vs { text-align: center; }
}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><img src="data:image/png;base64,__LOGO__" alt="rm agency"><div><b>Qué vídeos hacer</b><small id="fecha"></small></div></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Vista"></nav>
</div></header>
<main class="wrap" id="app"><p class="sub">Cargando datos…</p></main>
<div id="tip" hidden></div>

<script>
"use strict";
// Los datos viven en datos.json, publicado al lado de la página: así la tarea programada diaria
// solo sube ese archivo y la página (ligera) no cambia (08/10/2026).
(async () => {
const D = await fetch("datos.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
if (!D) { document.getElementById("app").innerHTML = '<p class="sub">No se han podido cargar los datos. Recarga la página en unos segundos.</p>'; return; }
const U = D.umbrales;
const ACTIVOS = Object.keys(D.decisiones);
const CLIENTES = [...ACTIVOS, ...Object.keys(D.clientes).filter(s => !ACTIVOS.includes(s))];
const COLOR = {}; ["xavi-colomina", "jesus-mora", "newmos", "golossa"].forEach((s, i) => COLOR[s] = `var(--c${i + 1})`);
CLIENTES.forEach((s, i) => { if (!COLOR[s]) COLOR[s] = `var(--c${(i % 4) + 1})`; });
const label = s => D.labels[s] || s;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// La nota es un MULTIPLICADOR: ×1 = un vídeo normal de ese cliente, ×2 = rinde el doble.
const num = n => (Math.round(n * 10) / 10).toFixed(1).replace(".", ",");
const fmt = n => "×" + num(n);
const pct = n => Math.round(n * 100) + "%";
const med = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : 0; };
const $ = (sel, el = document) => el.querySelector(sel);
const DIMS = ["Formato", "Tipo de idea", "Palanca", "Plantilla"];
const DIMK = { "Tipo de idea": "ti", "Formato": "fo", "Palanca": "pa", "Plantilla": "pl" };
// Nombre de cada etiqueta en lenguaje de calle: la pregunta que responde + qué es.
const DIMQ = { "Tipo de idea": "de qué va", "Formato": "qué forma tiene", "Plantilla": "cómo se cuenta", "Palanca": "por qué engancha" };
const nombre1 = (d, v) => d === "Plantilla" ? (v.charAt(0).toUpperCase() + v.slice(1)).replace(/-/g, " ") : v;
const partes = g => { const ds = g.dimension.split(" + "), vs = g.valor.split(" + "); return ds.map((d, i) => ({ d, v: vs[i] })); };
const nombre = g => partes(g).map(p => nombre1(p.d, p.v)).join(" + ");
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const pregunta = g => partes(g).map(p => DIMQ[p.d] || p.d).join(" + ");
const queEs1 = (d, v) => ((D.glosario[d] || {})[v] || "").replace(/\s*\(.*?\)\s*$/, "");
const queEs = g => partes(g).map(p => { const t = queEs1(p.d, p.v); return t ? `${nombre1(p.d, p.v)}: ${t}` : ""; }).filter(Boolean).join(" · ");

let vista = "agencia";
const ocultos = new Set();
try { const h = location.hash.slice(1); if (h && (h === "agencia" || D.clientes[h] || ACTIVOS.includes(h))) vista = h; } catch (e) {}
$("#fecha").textContent = "Datos de Notion + Metricool · " + D.generado.replace("T", " ");

/* ---------- pestañas ---------- */
function pintarTabs() {
  $("#tabs").innerHTML = ["agencia", ...CLIENTES].map(id => {
    const ref = id !== "agencia" && D.clientes[id] && !D.clientes[id].activo ? "<i>Aprendizaje</i>" : "";
    return `<button class="tab" role="tab" data-id="${id}" aria-selected="${id === vista}">${id === "agencia" ? "Agencia" : esc(label(id))}${ref}</button>`;
  }).join("");
}
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  vista = b.dataset.id; try { history.replaceState(null, "", "#" + vista); } catch (er) {}
  pintar(); window.scrollTo({ top: 0 });
});

/* ---------- piezas comunes ---------- */
const videos = slug => D.videos.filter(v => !slug || v.c === slug);
function ejemploHTML(v) {
  const t = `${esc(v.titulo || v.t || "(sin título)")} <span class="n">· ${fmt(v.nota ?? v.n)}</span>`;
  const u = v.url || v.u;
  return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : `<span class="t">${t}</span>`;
}
function clienteChips(g) {
  return Object.entries(g.por_cliente).map(([c, r]) => {
    const cl = r.n < U.min_n ? "" : r.mediana >= U.alto ? "good" : r.mediana < U.bajo ? "bad" : "";
    return `<span class="chip ${cl}" data-tip="${esc(`${label(c)}: ${fmt(r.mediana)} sobre ${r.n} vídeo${r.n === 1 ? "" : "s"}`)}"><span class="sw" style="background:${COLOR[c]}"></span>${esc(label(c))} <span class="n">${fmt(r.mediana)}</span></span>`;
  }).join("");
}
function leyenda(slugs) {
  return `<div class="legend">${slugs.map(s => `<button data-leg="${s}" aria-pressed="${!ocultos.has(s)}"><span class="sw" style="background:${COLOR[s]}"></span>${esc(label(s))}</button>`).join("")}</div>`;
}
function tileDesplegable(n, txt, items) {
  return `<details class="tile dd"><summary><b class="n">${n}</b><span class="lbl">${txt} ▾</span></summary><ul>${items.join("") || "<li>—</li>"}</ul></details>`;
}

/* Podio: qué es cada patrón, cuánto rinde (×) y en qué clientes */
function podio(lista) {
  // El podio pide el doble de vídeos que el mínimo: con 3-5 un golpe de suerte sube al nº 1.
  const top = lista.filter(g => g.veredicto === "haz más" && g.n >= U.min_n * 2).slice(0, 8);
  if (!top.length) return '<p class="sub">Nada concluyente todavía.</p>';
  const max = Math.max(3, ...top.map(g => g.mediana));
  return `<ol class="podio">${top.map((g, i) => `<li class="prow">
    <span class="pos">${i + 1}</span>
    <div class="pmain">
      <div class="ptitle"><b>${esc(nombre(g))}</b><span class="eyebrow">${esc(pregunta(g))}</span></div>
      ${queEs(g) ? `<p class="pdesc">${esc(queEs(g))}</p>` : ""}
      <div class="pbar"><span class="fill" style="width:${Math.min(100, g.mediana / max * 100)}%"><b>${fmt(g.mediana)}</b></span><span class="one" style="left:${100 / max}%" data-tip="×1 = un vídeo normal"></span></div>
      <div class="chips">${clienteChips(g)}<span class="chip">${g.n} vídeos · pegan ${pct(g.pega)}</span></div>
    </div></li>`).join("")}</ol>`;
}

/* Mapa de calor: etiquetas (agrupadas por lo que responden) × clientes */
function celda(r) {
  if (!r) return `<td class="vacio" data-tip="Este cliente aún no lo ha probado: oportunidad">sin probar</td>`;
  const t = Math.max(-1, Math.min(1, Math.log2(r.mediana) / 2));
  const p = Math.round(Math.abs(t) * 100), col = t >= 0 ? "var(--good)" : "var(--bad)";
  const tinta = p > 55 ? "#fff" : "var(--ink)";
  const op = r.n < U.min_n ? "opacity:.5;" : "";
  return `<td style="${op}background:color-mix(in srgb, ${col} ${p}%, var(--card));color:${tinta}" data-tip="${esc(`rinde ${fmt(r.mediana)} frente a un vídeo normal, sobre ${r.n} vídeos${r.n < U.min_n ? " (no concluye)" : ""}`)}">${fmt(r.mediana)}<small>${r.n} víd.</small></td>`;
}
function mapaCalor(lista) {
  const cols = CLIENTES.filter(c => D.clientes[c]);
  const bloques = DIMS.map(d => ({ d, filas: lista.filter(g => g.dimension === d && g.n >= U.min_n)
    .sort((a, b) => b.n - a.n).slice(0, 6).sort((a, b) => b.ajustada - a.ajustada) })).filter(b => b.filas.length);
  return `<div class="heatwrap"><table class="heat"><thead><tr><th></th>${cols.map(c => `<th><span class="sw" style="background:${COLOR[c]}"></span>${esc(label(c))}</th>`).join("")}</tr></thead>
    ${bloques.map(b => `<tbody><tr><th class="grp" colspan="${cols.length + 1}">${esc(DIMQ[b.d])} <small>(${esc(b.d)})</small></th></tr>
      ${b.filas.map(g => `<tr><th class="rowh" data-tip="${esc(queEs(g) || nombre(g))}">${esc(nombre(g))}</th>${cols.map(c => celda(g.por_cliente[c])).join("")}</tr>`).join("")}</tbody>`).join("")}
    </table></div>
    <div class="scale"><span>peor que lo normal</span><span class="grad"></span><span>mejor que lo normal</span><span>· rayado = sin probar · tenue = menos de ${U.min_n} vídeos</span></div>`;
}

/* Dispersión: alcance (x) vs conexión (y), escala log */
function dispersion(slug) {
  const W = 640, H = 400, m = { l: 44, r: 16, t: 16, b: 38 };
  const lo = 0.1, hi = 10, lx = v => Math.log10(Math.min(hi, Math.max(lo, v)));
  const X = v => m.l + (lx(v) - lx(lo)) / (lx(hi) - lx(lo)) * (W - m.l - m.r);
  const Y = v => H - m.b - (lx(v) - lx(lo)) / (lx(hi) - lx(lo)) * (H - m.t - m.b);
  const vs = videos(slug).filter(v => v.rv > 0 && v.ri > 0 && !ocultos.has(v.c));
  const maxV = Math.max(1, ...vs.map(v => v.vi));
  const ticks = [0.1, 0.3, 1, 3, 10];
  const pts = vs.sort((a, b) => b.vi - a.vi).map(v => {
    const r = 3.5 + Math.sqrt(v.vi / maxV) * 11;
    const tip = `${label(v.c)} · ${v.t} — ${Math.round(v.vi).toLocaleString("es")} vistas · alcance ×${num(v.rv)} · conexión ×${num(v.ri)} · nota ${fmt(v.n)}`;
    return `<circle class="pt" cx="${X(v.rv).toFixed(1)}" cy="${Y(v.ri).toFixed(1)}" r="${r.toFixed(1)}" fill="${COLOR[v.c]}" data-tip="${esc(tip)}" data-url="${esc(v.u)}"></circle>`;
  }).join("");
  const q = (x, y, t, a) => `<text class="quad" x="${x}" y="${y}" text-anchor="${a}">${t}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cada vídeo según alcance y conexión">
    ${ticks.map(t => `<line class="grid" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H - m.b}"></line><line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"></line>
      <text x="${X(t)}" y="${H - m.b + 16}" text-anchor="middle">×${num(t)}</text><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">×${num(t)}</text>`).join("")}
    <line class="base" x1="${X(1)}" x2="${X(1)}" y1="${m.t}" y2="${H - m.b}"></line><line class="base" x1="${m.l}" x2="${W - m.r}" y1="${Y(1)}" y2="${Y(1)}"></line>
    ${q(W - m.r - 6, m.t + 16, "Llega y conecta", "end")}${q(m.l + 8, m.t + 16, "Conecta pero no llega", "start")}
    ${q(W - m.r - 6, H - m.b - 10, "Llega pero no conecta", "end")}${q(m.l + 8, H - m.b - 10, "Ni llega ni conecta", "start")}
    ${pts}
    <text x="${(W + m.l) / 2}" y="${H - 4}" text-anchor="middle">Alcance: vistas frente a lo normal del cliente →</text>
    <text x="12" y="${(H - m.b) / 2}" text-anchor="middle" transform="rotate(-90 12 ${(H - m.b) / 2})">Conexión: % de interacción →</text></svg>`;
}

/* Evolución: nota mediana por mes y cliente */
function evolucion(slug) {
  const cs = slug ? [slug] : CLIENTES.filter(c => D.clientes[c]);
  const series = cs.filter(c => !ocultos.has(c)).map(c => {
    const g = {};
    videos(c).forEach(v => (g[v.f.slice(0, 7)] = g[v.f.slice(0, 7)] || []).push(v.n));
    return { c, p: Object.entries(g).filter(([, a]) => a.length >= 2).map(([k, a]) => ({ k, m: med(a), n: a.length })).sort((a, b) => a.k < b.k ? -1 : 1) };
  }).filter(s => s.p.length);
  const meses = [...new Set(series.flatMap(s => s.p.map(p => p.k)))].sort();
  if (meses.length < 2) return '<p class="sub">Aún no hay meses suficientes para ver una tendencia.</p>';
  const W = 640, H = 260, m = { l: 36, r: 16, t: 14, b: 30 };
  const ymax = Math.max(2, Math.ceil(Math.max(...series.flatMap(s => s.p.map(p => p.m)))));
  const X = k => m.l + meses.indexOf(k) / (meses.length - 1) * (W - m.l - m.r);
  const Y = v => H - m.b - v / ymax * (H - m.t - m.b);
  const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const ys = [...Array(ymax + 1).keys()];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Nota mediana por mes">
    ${ys.map(t => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"></line><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">×${t}</text>`).join("")}
    <line class="base" x1="${m.l}" x2="${W - m.r}" y1="${Y(1)}" y2="${Y(1)}"></line>
    ${meses.map(k => `<text x="${X(k)}" y="${H - 8}" text-anchor="middle">${MES[+k.slice(5) - 1]} ${k.slice(2, 4)}</text>`).join("")}
    ${series.map(s => `<path class="ln" stroke="${COLOR[s.c]}" d="${s.p.map((p, i) => (i ? "L" : "M") + X(p.k).toFixed(1) + " " + Y(p.m).toFixed(1)).join(" ")}"></path>
      ${s.p.map(p => `<circle class="ld" cx="${X(p.k)}" cy="${Y(p.m)}" r="${p === s.p[s.p.length - 1] ? 6 : 4}" fill="${COLOR[s.c]}" data-tip="${esc(`${label(s.c)} · ${p.k}: ${fmt(p.m)} sobre ${p.n} vídeos`)}"></circle>`).join("")}`).join("")}
  </svg>`;
}

/* Barras de una dimensión (pestaña cliente) */
function barras(titulo, items, dim) {
  if (!items.length) return "";
  const max = Math.max(2, Math.ceil(Math.max(...items.map(i => i.mediana)) * 2) / 2);
  const x = v => Math.min(100, v / max * 100);
  return `<div class="panel bars"><h3>${esc(DIMQ[dim] || titulo)} <small>(${esc(titulo)})</small></h3>${items.map(i => {
    const k = i.n < U.min_n ? "x" : i.veredicto === "haz más" ? "g" : i.veredicto === "evita" ? "b" : "nn";
    const desc = dim ? queEs1(dim, i.valor) : "";
    return `<div class="hb" tabindex="0" data-tip="${esc(`${desc ? desc + " — " : ""}${fmt(i.mediana)} sobre ${i.n} vídeos · pegan ${pct(i.pega)}${k === "x" ? " · no concluye" : ""}`)}">
      <span class="l">${esc(dim ? nombre1(dim, i.valor) : i.valor)}</span><span class="track"><span class="fill ${k}" style="width:${x(i.mediana)}%"></span><span class="one" style="left:${x(1)}%"></span></span>
      <span class="v n">${fmt(i.mediana)} · ${i.n}</span></div>`;
  }).join("")}</div>`;
}
const keyHTML = `<div class="key"><span><i style="background:var(--good)"></i>Haz más (${fmt(U.alto)} o más)</span><span><i style="background:var(--neutral-bar)"></i>Normal</span>
  <span><i style="background:var(--bad)"></i>Evita</span><span><i class="fill x"></i>Menos de ${U.min_n} vídeos</span><span>┆ ×1 = lo normal</span></div>`;

/* Comparador: dos etiquetas SOBRE EL MISMO EJE, superpuestas */
let compA = null, compB = null;
function opcionesComp() {
  const vals = [];
  DIMS.forEach(d => { const st = new Set(); D.videos.forEach(v => (v[DIMK[d]] || []).forEach(x => st.add(x))); [...st].sort().forEach(x => vals.push(d + "|" + x)); });
  return vals;
}
const etiquetaComp = o => { const [d, v] = o.split("|"); return `${nombre1(d, v)} (${DIMQ[d]})`; };
function comparador() {
  const ops = opcionesComp(); if (ops.length < 2) return "";
  compA = compA || ops.find(o => o === "Plantilla|caso-real") || ops[0];
  compB = compB || ops.find(o => o === "Formato|Tips") || ops[1];
  const sel = (id, val) => `<select id="${id}" aria-label="Etiqueta a comparar">${ops.map(o => `<option value="${esc(o)}" ${o === val ? "selected" : ""}>${esc(etiquetaComp(o))}</option>`).join("")}</select>`;
  const de = o => { const [d, v] = o.split("|"); return videos().filter(x => (x[DIMK[d]] || []).includes(v)); };
  const A = de(compA), B = de(compB), mA = med(A.map(v => v.n)), mB = med(B.map(v => v.n));
  const W = 640, H = 170, lo = 0.1, hi = 10, X = v => 30 + (Math.log10(Math.min(hi, Math.max(lo, v))) + 1) / 2 * (W - 60);
  const pts = (vs, cls) => vs.map((v, i) => `<circle class="pt ${cls}" cx="${X(v.n).toFixed(1)}" cy="${70 + ((i * 37) % 50) - 25}" r="6" data-tip="${esc(`${label(v.c)} · ${v.t} · ${fmt(v.n)}`)}" data-url="${esc(v.u)}"></circle>`).join("");
  const medLine = (m, cls, txt) => `<line class="medl ${cls}" x1="${X(m)}" x2="${X(m)}" y1="10" y2="${H - 30}"></line><text class="medt ${cls}" x="${X(m)}" y="${H - 14}" text-anchor="middle">${txt} ${fmt(m)}</text>`;
  const nA = etiquetaComp(compA).split(" (")[0], nB = etiquetaComp(compB).split(" (")[0];
  const veredicto = (A.length >= U.min_n && B.length >= U.min_n)
    ? (Math.abs(mA - mB) < 0.05 ? "Rinden igual." : `<b>${esc(mA > mB ? nA : nB)}</b> rinde <b>${num(Math.max(mA, mB) / Math.min(mA, mB))} veces</b> lo que ${esc(mA > mB ? nB : nA)}.`)
    : `Una de las dos tiene menos de ${U.min_n} vídeos: todavía no concluye.`;
  return `<div class="panel comp">
    <div class="cselects"><label><span class="sw a"></span>${sel("compA", compA)}</label><span class="vs">vs</span><label><span class="sw b"></span>${sel("compB", compB)}</label></div>
    <div class="cnums"><span><b class="ca">${A.length ? fmt(mA) : "—"}</b>${A.length} vídeos</span><span><b class="cb">${B.length ? fmt(mB) : "—"}</b>${B.length} vídeos</span></div>
    <p class="cver">${veredicto}</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="Las dos etiquetas superpuestas">
      ${[0.1, 0.3, 1, 3, 10].map(t => `<line class="grid" x1="${X(t)}" x2="${X(t)}" y1="10" y2="${H - 30}"></line><text x="${X(t)}" y="${H}" text-anchor="middle">×${num(t)}</text>`).join("")}
      <line class="base" x1="${X(1)}" x2="${X(1)}" y1="10" y2="${H - 30}"></line>
      ${pts(B, "b")}${pts(A, "a")}
      ${A.length ? medLine(mA, "a", "A") : ""}${B.length ? medLine(mB, "b", "B") : ""}
    </svg>
    <p class="sub" style="margin:0">Cada punto es un vídeo; las líneas gruesas marcan la nota típica de cada etiqueta. A la derecha de la discontinua (×1), mejor de lo normal.</p></div>`;
}

/* ---------- vista Agencia ---------- */
function vistaAgencia() {
  const G = D.general.todo;
  const haz = G.filter(g => g.veredicto === "haz más").slice(0, 9);
  const evita = G.filter(g => g.veredicto === "evita").sort((a, b) => a.ajustada - b.ajustada).slice(0, 8);
  const conDatos = CLIENTES.filter(c => D.clientes[c]);
  const aprendizaje = conDatos.filter(c => !D.clientes[c].activo);
  const pocos = ACTIVOS.filter(c => D.clientes[c] && D.clientes[c].etiquetados < D.clientes[c].videos * 0.5)
    .map(c => `${label(c)} solo tiene ${D.clientes[c].etiquetados} de ${D.clientes[c].videos} vídeos etiquetados`);
  return `
  <section class="hero">
    <div><div class="eyebrow">toda la agencia</div><h1>Lo que <em>funciona</em> y lo que no, en un vistazo</h1></div>
    <div class="tiles">
      <div class="tile"><b class="n">${D.videos.length}</b><span class="lbl">vídeos medidos</span></div>
      ${tileDesplegable(haz.length, "patrones ganadores", haz.map(g => `<li><b>${esc(nombre(g))}</b> <span class="n">${fmt(g.mediana)}</span><small>${esc(cap(pregunta(g)))}</small></li>`))}
      ${tileDesplegable(ACTIVOS.length, "clientes actuales", ACTIVOS.map(c => `<li><span class="sw" style="background:${COLOR[c]}"></span><b>${esc(label(c))}</b><small>${D.clientes[c] ? D.clientes[c].videos + " vídeos medidos" : "sin datos todavía"}</small></li>`))}
      ${tileDesplegable(aprendizaje.length, "clientes de aprendizaje", aprendizaje.map(c => `<li><span class="sw" style="background:${COLOR[c]}"></span><b>${esc(label(c))}</b> · ${D.clientes[c].videos} vídeos
          <small>Lo que nos enseñó: ${D.clientes[c].dimensiones.filter(g => g.veredicto === "haz más").sort((a, b) => b.ajustada - a.ajustada).slice(0, 3).map(g => esc(nombre(g)) + " " + fmt(g.mediana)).join(" · ") || "nada concluyente"}</small></li>`))}
    </div>
    <details class="nota-explica"><summary>¿Qué significa <b>×2,9</b>?</summary>
      <p>Es <b>cuántas veces mejor que un vídeo normal de ese cliente</b> ha funcionado algo, contando a la vez <b>vistas</b> e <b>interacción</b>. <b>×1</b> es un vídeo normal; <b>×2</b>, el doble; <b>×0,5</b>, la mitad. No es una nota sobre 10. Como cada vídeo se compara con su propio cliente, se pueden poner juntos un vídeo de Xavi y uno de Golossa aunque tengan audiencias muy distintas.</p></details>
    ${pocos.length ? `<div class="note"><b>Ojo:</b> ${esc(pocos.join("; "))}. Lo marcado “solo probado en…” todavía no está comprobado en otros clientes.</div>` : ""}
  </section>
  <section><div class="eyebrow">propuestas</div><h2>Listas para implementar</h2>
    <p class="sub">Lo que propongo después de ver todos los vídeos. Las ideas de vídeo se revisan aquí y, al aceptarlas o rechazarlas con un motivo, van a la Bandeja de Notion.</p>
    ${D.propuestas ? `<p class="sub" style="margin-top:-8px">${esc(D.propuestas.resumen || "")}</p>` : ""}
    ${propuestasHTML(null)}</section>
  <section class="panel"><div class="eyebrow">el podio</div><h2>Los patrones que más pegan</h2>
    <p class="sub">Lo que mejor ha funcionado en toda la agencia, con al menos ${U.min_n * 2} vídeos detrás de cada uno. Cada patrón dice qué es y en qué clientes se ha probado.</p>
    ${podio(G)}</section>
  <section class="panel"><div class="eyebrow">mapa de calor</div><h2>Qué funciona en cada cliente</h2>
    <p class="sub">Verde: mejor que lo normal de ese cliente. Rojo: peor. Rayado: ese cliente aún no lo ha probado. Pasa el ratón por un nombre para ver qué es.</p>
    ${mapaCalor(G)}</section>
  <section class="panel"><div class="eyebrow">esfuerzo vs resultado</div><h2>Lo que hacemos frente a lo que pega</h2>
    <p class="sub">El círculo de la izquierda reparte todos los vídeos; el de la derecha, solo los que han pegado. Si una porción crece a la derecha, estamos haciendo poco de algo que funciona.</p>
    ${circulares(null)}</section>

/* ---------- Circulares: dónde ponemos el esfuerzo vs dónde está el resultado ---------- */
let dimDonut = "Formato";
const PAL = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];
function reparto(vs, dim) {
  const k = DIMK[dim], c = {}; let t = 0;
  vs.forEach(v => (v[k] || []).forEach(x => { c[x] = (c[x] || 0) + 1; t++; }));
  return { c, t };
}
function donutSVG(partes, total, centro, sub) {
  const cx = 100, cy = 100, R = 88, r = 56;
  let a = -Math.PI / 2, out = "";
  const pt = (ang, rad) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)];
  partes.forEach(p => {
    if (!p.v) return;
    const da = p.v / total * Math.PI * 2, b = a + da, big = da > Math.PI ? 1 : 0;
    if (da >= Math.PI * 2 - 1e-6) { out += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${p.col}" stroke-width="${R - r}"></circle>`; }
    else {
      const [x1, y1] = pt(a, R), [x2, y2] = pt(b, R), [x3, y3] = pt(b, r), [x4, y4] = pt(a, r);
      out += `<path d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z" fill="${p.col}" stroke="var(--card)" stroke-width="2" data-tip="${esc(`${p.k}: ${pct(p.v / total)}`)}"></path>`;
    }
    a = b;
  });
  return `<svg class="chart donut" viewBox="0 0 200 200" role="img" aria-label="${esc(centro)}">${out}
    <text x="100" y="98" text-anchor="middle" class="dc">${esc(centro)}</text><text x="100" y="118" text-anchor="middle">${esc(sub)}</text></svg>`;
}
function circulares(slug) {
  const todos = videos(slug), pegan = todos.filter(v => v.n >= U.alto);
  const A = reparto(todos, dimDonut), B = reparto(pegan, dimDonut);
  if (!A.t) return '<p class="sub">Aún no hay vídeos etiquetados.</p>';
  const top = Object.entries(A.c).sort((x, y) => y[1] - x[1]).slice(0, 4).map(([k]) => k);
  const filas = [...top.map((k, i) => ({ k, col: PAL[i] })), { k: "Otros", col: "var(--neutral-bar)" }];
  const val = (rep, k) => k === "Otros" ? rep.t - top.reduce((s, x) => s + (rep.c[x] || 0), 0) : (rep.c[k] || 0);
  const nom = k => k === "Otros" ? "Otros" : nombre1(dimDonut, k);
  const todas = Object.entries(A.c).sort((x, y) => y[1] - x[1]).map(([k]) => k);
  const sinEtq = todos.filter(v => !(v[DIMK[dimDonut]] || []).length).length;
  const pa = filas.map(f => ({ k: nom(f.k), col: f.col, v: val(A, f.k) })), pb = filas.map(f => ({ k: nom(f.k), col: f.col, v: val(B, f.k) }));
  const señal = f => {
    if (f.k === "Otros" || !B.t) return "";
    const d = val(B, f.k) / B.t - val(A, f.k) / A.t;
    return d >= 0.05 ? '<span class="chip good">Hacemos poco de lo que pega</span>' : d <= -0.05 ? '<span class="chip bad">Hacemos mucho y pega poco</span>' : "";
  };
  return `<div class="dsel" role="group" aria-label="Qué repartir">${DIMS.map(d => `<button data-dd="${d}" aria-pressed="${d === dimDonut}">${esc(cap(DIMQ[d]))}</button>`).join("")}</div>
    <div class="donuts">
      <figure>${donutSVG(pa, A.t, todos.length + " vídeos", "los que hacemos")}<figcaption>Dónde ponemos el esfuerzo</figcaption></figure>
      <figure>${B.t ? donutSVG(pb, B.t, pegan.length + " vídeos", `los que pegan (${fmt(U.alto)} o más)`) : '<p class="sub">Ninguno pega todavía.</p>'}<figcaption>Dónde está el resultado</figcaption></figure>
      <table class="t dleg"><thead><tr><th>${esc(cap(DIMQ[dimDonut]))}</th><th class="r">Hacemos</th><th class="r">Pegan</th><th></th></tr></thead><tbody>
        ${todas.map(k => { const f = { k, col: top.includes(k) ? PAL[top.indexOf(k)] : "var(--neutral-bar)" };
          return `<tr><td><span class="sw" style="background:${f.col}"></span>${esc(nom(k))}${top.includes(k) ? "" : ' <small class="otros">(en «Otros»)</small>'}</td><td class="num">${pct(val(A, k) / A.t)}</td><td class="num">${B.t ? pct(val(B, k) / B.t) : "—"}</td><td>${señal(f)}</td></tr>`; }).join("")}
      </tbody></table>
      <p class="sub dleg">«Otros» no son vídeos sin etiquetar: es la suma de las etiquetas que no caben en el círculo (en gris en la tabla). ${sinEtq ? `${sinEtq} de ${todos.length} vídeos no llevan esta etiqueta${dimDonut === "Tipo de idea" ? ": un tip o una explicación sin otro ángulo va sin Tipo de idea a propósito" : ""}.` : ""}</p>
    </div>`;
}

function propuestasHTML(slug) {

  if (!ps.length) return '<p class="sub">Todavía no hay propuestas.</p>';
  return `<div class="cards">${ps.map((p, i) => `<article class="card prop" data-p="${(D.propuestas.items).indexOf(p)}">
    <div class="eyebrow">${esc(p.cliente === "agencia" ? "Toda la agencia" : label(p.cliente))} · ${p.tipo === "idea" ? "Idea de vídeo" : "Cambio de estrategia"}</div>
    <h3>${esc(p.titulo)}</h3>
    <p class="pdesc"><b>Por qué:</b> ${esc(p.por_que)}</p>
    ${p.que_hacer ? `<p class="pdesc"><b>Qué hacer:</b> ${esc(p.que_hacer)}</p>` : ""}
    ${p.tipo === "idea" ? `<p class="why">${esc(p.gancho || "")}</p>
      <div class="chips">${[p.tipo_idea, p.formato, p.plantilla && nombre1("Plantilla", p.plantilla), p.palanca].filter(Boolean).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      <div class="adapt"><button class="btn solid" data-prop="${(D.propuestas.items).indexOf(p)}">Revisar y decidir</button></div>` : ""}
    <div class="slot"></div></article>`).join("")}</div>`;
}
